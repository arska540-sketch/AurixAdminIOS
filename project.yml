name: AurixAdmin
options:
  bundleIdPrefix: network.aurix
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  AurixAdmin:
    type: application
    platform: iOS
    sources:
      - path: AurixAdmin
        excludes:
          - Web
    resources:
      - path: AurixAdmin/Web
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: network.aurix.admin
        INFOPLIST_FILE: AurixAdmin/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
