name: Build IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App
        run: |
          xcodebuild \
            -project AurixAdmin.xcodeproj \
            -scheme AurixAdmin \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Make IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/AurixAdmin.app"
          mkdir -p "$APP/Web"
          cp "AurixAdmin/Web/index.html" "$APP/Web/index.html"
          test -s "$APP/Web/index.html"

          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry AurixAdmin.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AurixAdmin-IPA
          path: AurixAdmin.ipa
